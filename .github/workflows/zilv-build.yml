name: ZiLv iOS build
on:
  push:
    paths: ["ZiLv/**", ".github/workflows/zilv-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ZiLv
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project ZiLv.xcodeproj -scheme ZiLv -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 60
