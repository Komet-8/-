<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030d">
<title>噬核战车 · CORE EATER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#00f0ff;--m:#ff2bd6;--y:#ffe14d;--bg:#05030d;--f:"Orbitron","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:var(--f);color:#dff}
#root{position:fixed;left:50%;top:50%;width:960px;height:640px;transform-origin:center center;overflow:hidden;background:var(--bg);box-shadow:0 0 60px rgba(120,40,255,.25)}
#game{position:absolute;left:0;top:0;width:960px;height:640px;display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
#hurt{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,30,80,.55) 100%);transition:opacity .25s}
#flash{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;background:#fff;transition:opacity .4s}
.hidden{display:none!important}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hpwrap{position:absolute;left:14px;top:12px;width:240px}
.lbl{font-size:10px;letter-spacing:3px;color:#7ff;opacity:.8;margin-bottom:3px}
#hpbar{height:12px;border:1px solid #00f0ff;box-shadow:0 0 8px rgba(0,240,255,.5);background:rgba(0,240,255,.07);position:relative}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#00f0ff,#7dffea);box-shadow:0 0 10px #00f0ff;transition:width .15s}
#hpfill.low{background:linear-gradient(90deg,#ff2b6a,#ff7d9d);box-shadow:0 0 10px #ff2b6a}
#dashbar{height:4px;margin-top:5px;background:rgba(255,255,255,.08)}
#dashfill{height:100%;width:100%;background:#f0f0ff;box-shadow:0 0 6px #fff}
#slotwrap{position:absolute;left:12px;bottom:8px;opacity:.9}
#slots{display:flex;gap:6px}
.slot{width:112px;height:36px;border:1px dashed rgba(0,240,255,.35);display:flex;align-items:center;gap:6px;padding:0 6px;background:rgba(5,3,13,.55)}
.slot.full{border-style:solid}
.slot .nm{font-size:12px;line-height:1.2}
.slot .lv{font-size:9px;letter-spacing:1px;opacity:.85}
.slot .empty{font-size:10px;opacity:.4;letter-spacing:2px;width:100%;text-align:center}
#fusion{margin-bottom:4px;font-size:12px;letter-spacing:2px;color:#fff;text-shadow:0 0 6px #ff2bd6,0 0 14px #ff2bd6;min-height:16px}
#stinfo{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:14px;letter-spacing:3px;color:#fff;text-shadow:0 0 8px #ff2bd6}
#stinfo small{display:block;font-size:11px;color:#9ff;opacity:.85;margin-top:3px;letter-spacing:2px;text-shadow:none}
#score{position:absolute;right:62px;top:14px;font-size:16px;color:var(--y);text-shadow:0 0 8px var(--y);letter-spacing:2px}
#pausebtn,#mutebtn{position:absolute;top:10px;width:38px;height:32px;border:1px solid #00f0ff;background:rgba(0,240,255,.08);color:#00f0ff;font:700 13px var(--f);pointer-events:auto;cursor:pointer}
#pausebtn{right:14px}
#mutebtn{right:14px;top:48px;font-size:11px}
#bossbar{position:absolute;left:230px;right:230px;top:52px;text-align:center}
#bossname{font-size:12px;letter-spacing:4px;color:#ff2bd6;text-shadow:0 0 8px #ff2bd6;margin-bottom:4px}
#bosswrap{height:10px;border:1px solid #ff2bd6;box-shadow:0 0 10px rgba(255,43,214,.6);background:rgba(255,43,214,.08)}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff2bd6,#ff7de9);transition:width .1s}

#banner{position:absolute;left:0;right:0;top:40%;text-align:center;z-index:12;pointer-events:none;opacity:0}
#banner .b1{font-size:46px;font-weight:900;letter-spacing:10px;color:#fff;text-shadow:0 0 12px var(--bc,#ff2bd6),0 0 32px var(--bc,#ff2bd6)}
#banner .b2{font-size:15px;letter-spacing:6px;color:#bff;margin-top:8px}
#banner.show{animation:bannerA 2.2s ease forwards}
@keyframes bannerA{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}

/* Screens */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,13,.84);z-index:20;text-align:center;padding:28px}
.screen.show{display:flex}
.screen.clear-bg{background:rgba(5,3,13,.35)}
.btn{font:700 17px var(--f);color:#00f0ff;background:rgba(0,240,255,.06);border:2px solid #00f0ff;padding:11px 30px;margin:7px;cursor:pointer;letter-spacing:3px;box-shadow:0 0 12px rgba(0,240,255,.35),inset 0 0 12px rgba(0,240,255,.12);text-shadow:0 0 8px #00f0ff;transition:transform .12s,background .12s;min-width:220px}
.btn:hover,.btn:focus-visible{background:rgba(0,240,255,.2);transform:translateY(-2px);outline:none}
.btn.pink{color:#ff2bd6;border-color:#ff2bd6;background:rgba(255,43,214,.06);box-shadow:0 0 12px rgba(255,43,214,.35),inset 0 0 12px rgba(255,43,214,.12);text-shadow:0 0 8px #ff2bd6}
.btn.pink:hover{background:rgba(255,43,214,.2)}
.btn.small{font-size:13px;padding:8px 18px;min-width:0}
h1.title{font-size:92px;font-weight:900;letter-spacing:14px;color:#fff;text-shadow:0 0 10px #ff2bd6,0 0 30px #ff2bd6,0 0 70px #ff2bd6;animation:flick 4s infinite;line-height:1}
.subtitle{font-size:22px;letter-spacing:18px;color:#00f0ff;text-shadow:0 0 10px #00f0ff;margin:10px 0 26px;padding-left:18px}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4;transform:translateX(3px)}94%{opacity:1;transform:none}96%{opacity:.6}97%{opacity:1}}
.tagline{font-size:13px;color:#b9a8ff;letter-spacing:3px;margin-bottom:18px;opacity:.9}
.hint{font-size:12px;color:#8fa;opacity:.75;margin-top:16px;letter-spacing:1px;line-height:1.9}
.best{font-size:12px;color:var(--y);margin-top:6px;letter-spacing:2px;opacity:.85}
h2{font-size:40px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 10px var(--hc,#00f0ff),0 0 26px var(--hc,#00f0ff);margin-bottom:16px}
.stats{font-size:15px;line-height:2.1;letter-spacing:2px;color:#cff;margin-bottom:18px}
.stats b{color:var(--y);text-shadow:0 0 6px var(--y)}

/* story */
#story{justify-content:flex-end;padding-bottom:70px;cursor:pointer}
#storybox{width:760px;max-width:92%;border:1px solid #ff2bd6;background:rgba(10,4,24,.92);box-shadow:0 0 22px rgba(255,43,214,.35);padding:20px 26px;text-align:left;position:relative}
#storyspk{position:absolute;top:-14px;left:18px;background:#05030d;border:1px solid #ff2bd6;color:#ff2bd6;padding:2px 12px;font-size:13px;letter-spacing:3px;text-shadow:0 0 6px #ff2bd6}
#storytxt{font-size:19px;line-height:1.75;color:#eef;min-height:66px;letter-spacing:1px}
#storynext{position:absolute;right:14px;bottom:8px;font-size:11px;color:#0ff;opacity:.7;animation:blink 1s infinite}
#storyskip{position:absolute;right:18px;top:16px}
#storystage{position:absolute;top:60px;left:0;right:0;font-size:15px;letter-spacing:8px;color:#9ff;opacity:.8}
@keyframes blink{50%{opacity:.15}}

/* choice */
#choice{background:rgba(5,3,13,.45)}
#choice h3{font-size:24px;letter-spacing:6px;color:#fff;text-shadow:0 0 10px var(--cc);margin-bottom:6px}
#choice .sub{font-size:13px;color:#bcd;margin-bottom:18px;letter-spacing:1px}
.copts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.copt{width:230px;padding:14px 12px;border:2px solid #00f0ff;background:rgba(5,3,13,.9);cursor:pointer;color:#dff;font-family:var(--f);text-align:center;transition:transform .12s}
.copt:hover{transform:translateY(-3px);background:rgba(0,240,255,.12)}
.copt .k{font-size:11px;opacity:.6;letter-spacing:2px}
.copt .t{font-size:16px;margin:6px 0;letter-spacing:2px}
.copt .f{font-size:12px;color:#fff;text-shadow:0 0 6px #ff2bd6;min-height:18px}
.copt .d{font-size:11px;opacity:.7;margin-top:4px;line-height:1.5}

/* codex */
#codex{justify-content:flex-start;padding-top:22px;overflow-y:auto;touch-action:pan-y}
#codex h2{font-size:30px;margin-bottom:6px}
.cxh{font-size:13px;letter-spacing:5px;color:#9ff;margin:10px 0 8px}
.cxgrid{display:grid;grid-template-columns:repeat(4,208px);gap:8px;justify-content:center}
.cxgrid.fu{grid-template-columns:repeat(4,208px)}
.cx{border:1px solid rgba(255,255,255,.18);padding:8px 10px;text-align:left;background:rgba(10,6,26,.8);min-height:66px}
.cx .n{font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.cx .d{font-size:10.5px;opacity:.72;margin-top:4px;line-height:1.5}
.cx.lock{opacity:.4}
.cx.fus .n{color:#fff;text-shadow:0 0 6px #ff2bd6}
#cxcount{font-size:12px;color:var(--y);letter-spacing:2px}

/* touch */
#touch{position:fixed;inset:0;z-index:15;display:none}
#touch.on{display:block}
.joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(0,240,255,.5);background:rgba(0,240,255,.06);box-shadow:0 0 18px rgba(0,240,255,.25);pointer-events:none;display:none}
.joy.aim{border-color:rgba(255,43,214,.55);background:rgba(255,43,214,.06);box-shadow:0 0 18px rgba(255,43,214,.3)}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,240,255,.45);box-shadow:0 0 14px #00f0ff}
.joy.aim .knob{background:rgba(255,43,214,.5);box-shadow:0 0 14px #ff2bd6}
.tzone{position:fixed;bottom:18px;font:700 11px var(--f);letter-spacing:2px;color:rgba(255,255,255,.25);pointer-events:none}
#dashbtn{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:170px;width:74px;height:74px;border-radius:50%;border:2px solid #f0f0ff;color:#fff;font:700 13px var(--f);background:rgba(240,240,255,.08);box-shadow:0 0 14px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;letter-spacing:1px}
#dashbtn.cd{opacity:.35}
body.touch .btn{font-size:24px;padding:16px 36px}
body.touch .copt{width:270px;padding:20px 14px}
body.touch .copt .t{font-size:22px}
body.touch #storytxt{font-size:24px}
body.touch #pausebtn,body.touch #mutebtn{width:56px;height:44px;font-size:16px}
body.touch #mutebtn{top:62px}
#rotate{position:fixed;inset:0;z-index:50;background:#05030d;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:18px;letter-spacing:3px;color:#0ff;text-align:center;gap:18px}
#rotate.show{display:flex}
#rotate .phone{width:46px;height:78px;border:3px solid #0ff;border-radius:8px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="root">
  <canvas id="game"></canvas>
  <div id="fx"></div>
  <div id="hurt"></div>
  <div id="flash"></div>

  <div id="hud" class="hidden">
    <div id="hpwrap">
      <div class="lbl">HULL · 噬核-07</div>
      <div id="hpbar"><i id="hpfill"></i></div>
      <div id="dashbar"><div id="dashfill"></div></div>
    </div>
    <div id="slotwrap"><div id="fusion"></div><div id="slots"><div class="slot" id="slot0"></div><div class="slot" id="slot1"></div></div></div>
    <div id="stinfo"><span id="stname"></span><small id="stleft"></small></div>
    <div id="bossbar" class="hidden"><div id="bossname"></div><div id="bosswrap"><div id="bossfill"></div></div></div>
    <div id="score">0</div>
    <button id="pausebtn" title="暂停 (Esc)">II</button>
    <button id="mutebtn" title="声音 (M)">♪</button>
  </div>

  <div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>

  <!-- title -->
  <div class="screen show" id="title">
    <h1 class="title">噬核战车</h1>
    <div class="subtitle">CORE·EATER</div>
    <div class="tagline">击毁敌人 · 吞噬核心 · 夺取它们的力量</div>
    <button class="btn" id="btnContinue">继续游戏</button>
    <button class="btn" id="btnStart">新游戏</button>
    <button class="btn pink" id="btnCodex">核心图鉴</button>
    <div class="best" id="bestline"></div>
    <div class="hint" id="ctrlhint"></div>
  </div>

  <div class="screen" id="story">
    <div id="storystage"></div>
    <button class="btn small" id="storyskip">跳过 ▸▸</button>
    <div id="storybox"><div id="storyspk"></div><div id="storytxt"></div><div id="storynext">▼ 点击继续</div></div>
  </div>

  <div class="screen clear-bg" id="choice">
    <h3 id="chTitle"></h3>
    <div class="sub" id="chSub"></div>
    <div class="copts" id="chOpts"></div>
  </div>

  <div class="screen" id="clear">
    <h2 style="--hc:#5dff8a">区域清除</h2>
    <div class="stats" id="clearStats"></div>
    <button class="btn" id="btnNext">继续前进</button>
  </div>

  <div class="screen" id="over">
    <h2 style="--hc:#ff2b6a">战车被摧毁</h2>
    <div class="stats" id="overStats"></div>
    <button class="btn" id="btnRetry">重试本关</button>
    <button class="btn pink" id="btnToTitle">返回标题</button>
  </div>

  <div class="screen" id="pause">
    <h2>暂停</h2>
    <button class="btn" id="btnResume">继续</button>
    <button class="btn" id="btnPauseCodex">核心图鉴</button>
    <button class="btn pink" id="btnQuit">返回标题</button>
    <div class="hint" id="pausehint"></div>
  </div>

  <div class="screen" id="ending">
    <h2 style="--hc:#ffe14d">通关</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="btnEndTitle">返回标题</button>
  </div>

  <div class="screen" id="codex">
    <h2>核心图鉴</h2>
    <div id="cxcount"></div>
    <div class="cxh">— 核心能力 —</div>
    <div class="cxgrid" id="cxAb"></div>
    <div class="cxh">— 融合 —</div>
    <div class="cxgrid fu" id="cxFu"></div>
    <button class="btn small" id="btnCodexBack" style="margin-top:14px">返回</button>
  </div>
</div>

<div id="touch">
  <div class="joy" id="joyL"><div class="knob"></div></div>
  <div class="joy aim" id="joyR"><div class="knob"></div></div>
  <div class="tzone" style="left:24px">◀ 左半屏：移动</div>
  <div class="tzone" style="right:24px">右半屏：瞄准+开火 ▶</div>
  <div id="dashbtn">冲刺</div>
</div>
<div id="rotate"><div class="phone"></div>请横屏游玩<br><small style="font-size:12px;opacity:.7">（点击任意处仍可继续）</small></div>

<script>
(() => {
'use strict';
// ================= 基础 =================
const W = 960, H = 640, TS = 32, COLS = 30, ROWS = 20;
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const root = $('root');
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const FONT = '"Orbitron","PingFang SC","Microsoft YaHei",sans-serif';
let SCALE = 1, DPR = Math.min(2, window.devicePixelRatio || 1), K = 1;
const HQ = !IS_TOUCH;

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const lerpAng = (a, b, t) => a + angDiff(a, b) * clamp(t, 0, 1);
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = clamp(t, 0, 1);
  return hyp(ax + dx * t - px, ay + dy * t - py);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// ================= 核心能力 & 融合 =================
const AB = {
  laser:  { name: '激光', en: 'LASER',  color: '#ff3d7f', icon: 'M3 12h13M12 7l5 5-5 5M20 8v8', desc: '主武器变为穿透光束：可贯穿多个敌人，伤害高、射速慢。' },
  split:  { name: '分裂', en: 'SPLIT',  color: '#ff8a3d', icon: 'M3 12h6M9 12l10-7M9 12h12M9 12l10 7', desc: '一次射出扇形多发子弹。Lv2 起变为五连发。' },
  bounce: { name: '弹射', en: 'BOUNCE', color: '#5dff8a', icon: 'M2 18l5-12 5 12 5-12 5 12', desc: '子弹可在墙壁间反弹，等级越高反弹次数越多。' },
  homing: { name: '追踪', en: 'HOMING', color: '#c86bff', icon: 'M4 20C4 11 10 6 19 6M15 2l4 4-4 4', desc: '子弹自动转向附近敌人。与激光搭配时提供瞄准辅助。' },
  frost:  { name: '冰冻', en: 'FROST',  color: '#8fe9ff', icon: 'M12 2v20M3.5 7l17 10M3.5 17l17-10', desc: '命中使敌人减速。Lv3 有几率直接冻结。' },
  mine:   { name: '地雷', en: 'MINE',   color: '#ffe14d', icon: 'M17 12a5 5 0 1 1-10 0a5 5 0 1 1 10 0M12 2v4M12 18v4M2 12h4M18 12h4', desc: '移动时自动在身后布雷，爆炸还能炸开砖墙。' },
  shield: { name: '护盾', en: 'SHIELD', color: '#4d7dff', icon: 'M12 2l8 3v7c0 5-4 8-8 10-4-2-8-5-8-10V5z', desc: '抵挡一次伤害后自动充能。Lv3 可储存两层。' },
  phase:  { name: '相位', en: 'PHASE',  color: '#f0f0ff', icon: 'M2 12h3M8 12h3M14 12h8M18 8l4 4-4 4', desc: '冲刺期间无敌，可穿过敌人并造成伤害，冷却大幅缩短。' },
};
const AB_IDS = Object.keys(AB);
const FUS = [
  { id: 'prism',     a: 'laser',  b: 'split',  name: '棱镜激光', desc: '激光折射为三道光束。' },
  { id: 'mirror',    a: 'laser',  b: 'bounce', name: '镜面回廊', desc: '激光会在墙面之间反射三次。' },
  { id: 'zero',      a: 'laser',  b: 'frost',  name: '绝对零度', desc: '激光直接冻结命中的敌人。' },
  { id: 'photon',    a: 'laser',  b: 'phase',  name: '光子冲刺', desc: '冲刺轨迹会留下一道灼烧光束。' },
  { id: 'fission',   a: 'split',  b: 'bounce', name: '裂变弹',   desc: '子弹每次反弹都会一分为二。' },
  { id: 'swarm',     a: 'split',  b: 'homing', name: '蜂群导弹', desc: '射出一大群追踪微型导弹。' },

}

function openCodex(from) {
  codexReturn = from; screen = 'codex';
  $('cxAb').innerHTML = AB_IDS.map(id => { const u = codex.ab.includes(id), a = AB[id]; return `<div class="cx ${u ? '' : 'lock'}" style="${u ? 'border-color:' + a.color + '88' : ''}"><div class="n">${u ? iconSVG(id, 18) : '◇'}<span style="color:${u ? a.color : '#888'}">${u ? a.name + ' · ' + a.en : '??? 未吞噬'}</span></div><div class="d">${u ? a.desc : '击毁带有该核心的敌人并吞噬它。'}</div></div>`; }).join('');
  $('cxFu').innerHTML = FUS.map(f => { const u = codex.fu.includes(f.id); const hintA = codex.ab.includes(f.a) ? AB[f.a].name : '???'; return `<div class="cx fus ${u ? '' : 'lock'}"><div class="n">${u ? iconSVG(f.a, 16) + iconSVG(f.b, 16) + f.name : '??? 未发现'}</div><div class="d">${u ? `${AB[f.a].name} + ${AB[f.b].name}：${f.desc}` : `提示：${hintA} + ???`}</div></div>`; }).join('');
  $('cxcount').textContent = `核心 ${codex.ab.length}/8 · 融合 ${codex.fu.length}/${FUS.length}`;
  showScreen('codex');
}
function pauseGame() { if (screen !== 'play') return; screen = 'pause'; showScreen('pause'); }
function resumeGame() { screen = 'play'; showScreen(null); }

// ================= 事件绑定 =================
function unlockAudio() { Snd.init(); Snd.resume(); if (screen === 'title' && !Music.timer) Music.start('title'); }
window.addEventListener('pointerdown', unlockAudio, { passive: true });
window.addEventListener('keydown', unlockAudio);

$('btnStart').onclick = () => { Snd.play('select'); store.del('ce_save'); newRun(0); runStory(STORY[0], 'STAGE 1 · ' + STAGES[0].name, () => startStage(0)); };
$('btnContinue').onclick = () => { if (!save) return; Snd.play('select'); newRun(save.stage, save.slots, save.score); G.carryHp = save.hp || 100; runStory(STORY[save.stage].slice(-2), `STAGE ${save.stage + 1} · ${STAGES[save.stage].name}`, () => startStage(save.stage)); };
$('btnCodex').onclick = () => openCodex('title');
$('btnCodexBack').onclick = () => { if (codexReturn === 'pause') { screen = 'pause'; showScreen('pause'); } else toTitle(); };
$('btnNext').onclick = () => { if (screen === 'clear') nextStage(); };
$('btnRetry').onclick = () => retry();
$('btnToTitle').onclick = toTitle;
$('btnResume').onclick = resumeGame;
$('btnPauseCodex').onclick = () => openCodex('pause');
$('btnQuit').onclick = toTitle;
$('btnEndTitle').onclick = toTitle;
$('pausebtn').onclick = e => { e.stopPropagation(); screen === 'pause' ? resumeGame() : pauseGame(); };
$('mutebtn').onclick = e => { e.stopPropagation(); Snd.setMute(!Snd.muted); };
$('story').addEventListener('click', e => { if (e.target.id !== 'storyskip') storyNext(); });
$('storyskip').onclick = e => { e.stopPropagation(); storySkip(); };
$('rotate').onclick = () => { rotateDismissed = true; $('rotate').classList.remove('show'); };

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (screen === 'play') {
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') dashReq = true;
    if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
  } else if (screen === 'pause' && (e.code === 'Escape' || e.code === 'KeyP')) resumeGame();
  else if (screen === 'choice') { const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code]; if (n !== undefined) resolveChoice(n); }
  else if (screen === 'story' && (e.code === 'Space' || e.code === 'Enter')) storyNext();
  else if (screen === 'story' && e.code === 'Escape') storySkip();
  else if (screen === 'clear' && (e.code === 'Space' || e.code === 'Enter')) nextStage();
  if (e.code === 'KeyM') Snd.setMute(!Snd.muted);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (screen === 'play') pauseGame(); });
function toWorld(cx, cy) { const r = cvs.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
window.addEventListener('mousemove', e => { if (performance.now() - lastTouch < 1000) return; const w = toWorld(e.clientX, e.clientY); mouse.x = w.x; mouse.y = w.y; mouse.used = true; if (inputMode !== 'mouse') { inputMode = 'mouse'; updateTouchLayer(); } });
window.addEventListener('mousedown', e => {
  if (performance.now() - lastTouch < 1000 || screen !== 'play' || (e.target.closest && e.target.closest('button'))) return;
  inputMode = 'mouse'; mouse.used = true; const w = toWorld(e.clientX, e.clientY); mouse.x = w.x; mouse.y = w.y;
  if (e.button === 0) mouse.down = true; if (e.button === 2) dashReq = true;
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());

// 触屏双摇杆
const joyL = $('joyL'), joyR = $('joyR');
function placeJoy(el, x, y) { el.style.display = 'block'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.firstElementChild.style.transform = 'translate(0,0)'; }
function releaseSticks() { touch.move.id = touch.aim.id = null; touch.move.dx = touch.move.dy = 0; touch.aim.mag = 0; joyL.style.display = joyR.style.display = 'none'; }
const tl = $('touch');
window.addEventListener('touchstart', () => { lastTouch = performance.now(); if (inputMode !== 'touch') { inputMode = 'touch'; updateTouchLayer(); } }, { capture: true, passive: true });
const hitBtn = (t, id) => { const r = $(id).getBoundingClientRect(); return t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom; };
tl.addEventListener('touchstart', e => {
  e.preventDefault(); lastTouch = performance.now(); inputMode = 'touch';
  for (const t of e.changedTouches) {
    if (t.target.id === 'dashbtn') { dashReq = true; continue; }
    if (hitBtn(t, 'pausebtn')) { pauseGame(); continue; }
    if (hitBtn(t, 'mutebtn')) { Snd.setMute(!Snd.muted); continue; }
    if (t.clientX < window.innerWidth / 2 && touch.move.id === null) { touch.move.id = t.identifier; touch.move.ox = t.clientX; touch.move.oy = t.clientY; placeJoy(joyL, t.clientX, t.clientY); }
    else if (t.clientX >= window.innerWidth / 2 && touch.aim.id === null) { touch.aim.id = t.identifier; touch.aim.ox = t.clientX; touch.aim.oy = t.clientY; touch.aim.mag = 0; placeJoy(joyR, t.clientX, t.clientY); }
  }
}, { passive: false });
tl.addEventListener('touchmove', e => {
  e.preventDefault(); lastTouch = performance.now();
  for (const t of e.changedTouches) {
    const R = 55;
    if (t.identifier === touch.move.id) {
      let dx = t.clientX - touch.move.ox, dy = t.clientY - touch.move.oy; const d = hyp(dx, dy);
      if (d > R) { touch.move.ox += dx / d * (d - R); touch.move.oy += dy / d * (d - R); dx = dx / d * R; dy = dy / d * R; joyL.style.left = touch.move.ox + 'px'; joyL.style.top = touch.move.oy + 'px'; }
      touch.move.dx = dx / R; touch.move.dy = dy / R; joyL.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
    } else if (t.identifier === touch.aim.id) {
      let dx = t.clientX - touch.aim.ox, dy = t.clientY - touch.aim.oy; const d = hyp(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      touch.aim.mag = Math.min(1, d / R); if (d > 8) touch.aim.ang = Math.atan2(dy, dx); joyR.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
    }
  }
}, { passive: false });
function touchEnd(e) {
  lastTouch = performance.now();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.move.id) { touch.move.id = null; touch.move.dx = touch.move.dy = 0; joyL.style.display = 'none'; }
    if (t.identifier === touch.aim.id) { touch.aim.id = null; touch.aim.mag = 0; joyR.style.display = 'none'; }
  }
}
tl.addEventListener('touchend', touchEnd); tl.addEventListener('touchcancel', touchEnd);
if (IS_TOUCH) document.body.classList.add('touch');

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play') pauseGame(); });

// ================= 主循环 =================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && G.player && (screen === 'play' || screen === 'choice')) {
    const ts = G.timeScale * (screen === 'choice' ? .06 : 1);
    try { update(rdt * ts); } catch (err) { console.error(err); }
  }
  render(rdt);
}
resize(); refreshTitle(); Snd.setMute(Snd.muted);
requestAnimationFrame(frame);

// 调试接口（测试用）
window.__ce = { get G() { return G; }, get screen() { return screen; }, startStage: i => { if (!G) newRun(i); startStage(i); }, absorb: id => absorbCore({ id, x: G.player.x, y: G.player.y }), resolveChoice, STAGES, killBoss: () => { const b = G.boss; if (b && !b.dead) { G.orb = null; b.inv = 0; damageBoss(b, 1e6); } }, codex: () => codex };
})();
</script>
